[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slurm-aware"
version = "0.1.0"
description = "DeepRM-style scheduling simulation and reinforcement learning"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slurm-deeprm-generate = "slurm_aware.deeprm.generator:main"
slurm-deeprm-train = "slurm_aware.deeprm.train:main"
slurm-deeprm-evaluate = "slurm_aware.deeprm.evaluate:main"

[project.optional-dependencies]
deeprm = [
    "gymnasium>=1.2,<2",
    "matplotlib>=3.10",
    "numpy>=2.4.6",
    "torch>=2.14.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".venv", ".pytest_cache", ".ruff_cache", "__pycache__"]

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]
